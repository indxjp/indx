name: integration

# T3 real-service + T5 live tests. Opt-in: nightly + manual (keeps PR CI fast & key-free).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  services:
    name: real backends via docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: python -m build --wheel --outdir dist
      # Dockerfile.app layers the wheel on top of indx-core:latest, which only exists
      # locally — build it first or compose tries to pull it from Docker Hub.
      - name: Build the indx-core base image
        run: docker build -f docker/Dockerfile.core -t indx-core:latest .
      - name: Integration suite (qdrant / postgres / ollama)
        run: |
          docker compose -f docker/compose.integration.yml up \
            --build --abort-on-container-exit --exit-code-from tests
