name: integration

# T3 real-service + T5 live tests. Opt-in: nightly + manual (keeps PR CI fast & key-free).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  services:
    name: real backends via docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: python -m build --wheel --outdir dist
      - name: Integration suite (qdrant / postgres / ollama)
        run: |
          docker compose -f docker/compose.integration.yml up \
            --build --abort-on-container-exit --exit-code-from tests
